[project]
name = "linalg-ml-course"
version = "0.1.0"
description = "Curso interactivo de Álgebra Lineal para Machine Learning (herramientas Python del proyecto)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.scripts]
dev = "tools.dev:main"
build-assets = "tools.build_assets:main"
check-snippets = "tools.snippets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
